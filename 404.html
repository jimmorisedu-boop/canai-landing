<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Page not found — CanAI</title>
  <meta name="robots" content="noindex">
  <meta name="theme-color" content="#000000">
  <link rel="icon" type="image/svg+xml" href="assets/favicon.svg">
  <link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700&family=Geist+Mono:wght@400;500&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="styles.css">
  <style>
    .nf { min-height: 100vh; display: flex; flex-direction: column; align-items: center; justify-content: center; text-align: center; padding: 96px 24px; }
    .nf-code { font-family: var(--mono); font-size: 72px; line-height: 1; font-weight: 500; color: var(--accent); }
    .nf h1 { margin-top: 24px; font-size: 36px; line-height: 40px; font-weight: 700; letter-spacing: -0.02em; }
    .nf p { margin-top: 12px; font-size: 18px; line-height: 28px; color: var(--t2); max-width: 480px; }
    .nf .btn { margin-top: 32px; }
  </style>
</head>
<body>
  <main class="nf">
    <span class="nf-code">404</span>
    <h1>This board does not exist</h1>
    <p>The page you asked for is not here. It may have been moved, or the address has a typo in it.</p>
    <a class="btn btn-primary btn-main" href="index.html">Back to the landing page</a>
  </main>
</body>
</html>
